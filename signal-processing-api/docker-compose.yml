services:
  db:
    image: postgres:15-alpine
    container_name: signal-processing-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MinhaSenhaForte_2026!
      POSTGRES_DB: app
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    build: .
    container_name: signal-processing-db-init
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:MinhaSenhaForte_2026!@db:5432/app
    command: python -m app.core.db_init

  api1:
    build: .
    container_name: signal-processing-api1
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:MinhaSenhaForte_2026!@db:5432/app
      INSTANCE_NAME: api1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  api2:
    build: .
    container_name: signal-processing-api2
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:MinhaSenhaForte_2026!@db:5432/app
      INSTANCE_NAME: api2
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  api3:
    build: .
    container_name: signal-processing-api3
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:MinhaSenhaForte_2026!@db:5432/app
      INSTANCE_NAME: api3
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  nginx:
    image: nginx:latest
    container_name: signal-processing-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3

volumes:
  db_data: